                  path: DRS,
                  message: vDwzN,
                  content: Buffer.from(iVwj, 'utf8').toString('base64'),
                  branch: eI5qY,
                  sha: RBnl,
                });
                core.info(`COMMIT_OK attempt=${qvCZN} sha=${TnN.commit.sha} msg=${vDwzN}`);
                return;
              } catch (Vt) {
                GJpv = Vt;
                if (Vt.status === 409 && qvCZN < 4) {
                  core.warning(`Conflict on attempt ${qvCZN}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1500 * qvCZN));
                  continue;
